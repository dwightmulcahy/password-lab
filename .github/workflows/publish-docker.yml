name: Publish Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/i18n.js
          node --check assets/attack-rates.js
          node --check assets/passphrase-generator.js
          node --check assets/about.js
          node --check src/zxcvbn-entry.js
          node --check tools/build-web.mjs
          node --check tools/build-web-passphrase.mjs
          node --check tools/build-web-layout.mjs
          node --check tools/build-web-about.mjs
      - name: Validate QNAP Compose
        run: |
          docker compose -f docker-compose.qnap.yml config > /tmp/password-lab-qnap.yml
          grep -q '127.0.0.1' /tmp/password-lab-qnap.yml
          grep -q '18081' /tmp/password-lab-qnap.yml
      - name: Build local web bundle
        run: BUILD_SHA="${GITHUB_SHA::12}" BUILD_DATE="$(date -u +%FT%TZ)" BUILD_VERSION="${GITHUB_REF_NAME}" npm run build:web
      - name: Run regression tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_*.py
      - name: Build offline edition
        run: BUILD_VERSION="${GITHUB_REF_NAME}" npm run build:offline
      - name: Build release candidate image
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA::12}" --build-arg BUILD_DATE="$(date -u +%FT%TZ)" --build-arg BUILD_VERSION="${GITHUB_REF_NAME}" -t password-lab:release-candidate .
      - name: Start release candidate image
        run: docker run -d --rm --name password-lab-release -p 18080:8080 --read-only --tmpfs /tmp:size=16m --tmpfs /var/cache/nginx:size=16m --cap-drop ALL --security-opt no-new-privileges password-lab:release-candidate
      - name: Verify health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"healthy":true'; then exit 0; fi
            sleep 1
          done
          docker logs password-lab-release
          exit 1
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser smoke tests against Docker
        env:
          PASSWORD_LAB_BASE_URL: http://127.0.0.1:18080
        run: |
          python3 tests/browser_smoke.py
          python3 tests/about_smoke.py
      - name: Stop release candidate image
        if: always()
        run: docker rm -f password-lab-release || true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Capture build date
        id: build_date
        run: echo "value=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dwightmulcahy/password-lab
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Password Strength Lab
            org.opencontainers.image.description=Browser-based password strength and attack-scenario estimator
            org.opencontainers.image.source=https://github.com/dwightmulcahy/password-lab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
