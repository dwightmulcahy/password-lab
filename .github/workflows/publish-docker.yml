name: Release
on:
  push:
    tags: ['v*.*.*', '[0-9]*.*.*']

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: '26'

jobs:
  verify:
    name: Verify manual SemVer tag and ancestry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_latest: ${{ steps.version.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate stable semantic-version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be M.m.p or vM.m.p; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          latest_version="$(git tag --list | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [[ "$version" == "$latest_version" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  validate:
    name: Full reusable CI validation
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish multiarchitecture Docker Hub image
    needs: [verify, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build_date
        run: echo "value=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata and protected rolling tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: dwightmulcahy/password-lab
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.is_latest == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.verify.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Password Strength Lab
            org.opencontainers.image.description=Browser-based password strength and attack-scenario estimator
            org.opencontainers.image.source=https://github.com/dwightmulcahy/password-lab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - name: Build and push multiarchitecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            BUILD_VERSION=${{ needs.verify.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  offline:
    name: Offline ZIP and SHA256
    needs: [verify, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build offline ZIP and SHA256
        env:
          FEATURED_PROJECTS_REQUIRE_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          BUILD_SHA="${GITHUB_SHA::12}" BUILD_DATE="$(date -u +%FT%TZ)" BUILD_VERSION="$version" npm run build:offline
          (cd offline && zip -qr "../password-lab-${version}-offline.zip" .)
          sha256sum "password-lab-${version}-offline.zip" > "password-lab-${version}-offline.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            password-lab-*-offline.zip
            password-lab-*-offline.zip.sha256
          retention-days: 7

  github-release:
    name: GitHub Release with grouped Conventional Commits
    needs: [verify, validate, publish, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: .
      - name: Generate conventional release notes
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: "${GITHUB_REF_NAME}"
          project-name: "Password Strength Lab"
          image: "dwightmulcahy/password-lab"
          output: "release-notes.md"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          IS_LATEST: ${{ needs.verify.outputs.is_latest }}
        run: |
          set -euo pipefail
          asset="password-lab-${RELEASE_VERSION}-offline.zip"
          checksum="${asset}.sha256"
          title="Password Strength Lab ${RELEASE_VERSION}"
          if [[ "$IS_LATEST" == 'true' ]]; then
            flags=(--latest)
          else
            flags=(--latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" "$asset" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$checksum" \
              --verify-tag --notes-file release-notes.md --title "$title" "${flags[@]}"
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
