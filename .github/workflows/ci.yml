name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/i18n.js
          node --check assets/attack-rates.js
          node --check assets/zxcvbn-loader.js
      - name: Run Python regression tests
        run: python3 -m pytest -q tests/test_*.py
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build local web bundle
        run: npm run build:web
      - name: Build offline edition
        run: npm run build:offline
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run real browser smoke test
        run: python3 tests/browser_smoke.py
      - name: Build Docker image
        run: docker build -t password-strength-lab:ci .
