name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/i18n.js
          node --check assets/attack-rates.js
          node --check src/zxcvbn-entry.js
      - name: Build local web bundle
        run: BUILD_SHA="${GITHUB_SHA::12}" BUILD_DATE="$(date -u +%FT%TZ)" npm run build:web
      - name: Run regression tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_*.py
      - name: Build offline edition
        run: npm run build:offline
      - name: Build hardened Docker image
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA::12}" --build-arg BUILD_DATE="$(date -u +%FT%TZ)" -t password-lab:ci .
      - name: Start Docker image
        run: docker run -d --rm --name password-lab-ci -p 18080:8080 --read-only --tmpfs /tmp:size=16m --tmpfs /var/cache/nginx:size=16m --cap-drop ALL --security-opt no-new-privileges password-lab:ci
      - name: Verify health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"healthy":true'; then exit 0; fi
            sleep 1
          done
          docker logs password-lab-ci
          exit 1
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser smoke test against Docker
        env:
          PASSWORD_LAB_BASE_URL: http://127.0.0.1:18080
        run: python3 tests/browser_smoke.py
      - name: Stop Docker image
        if: always()
        run: docker rm -f password-lab-ci || true
