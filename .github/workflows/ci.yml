name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Install Python quality and test tools
        run: python -m pip install --disable-pip-version-check pytest ruff pyflakes
      # Bootstrap the generated npm lockfile from GitHub-hosted npm registry access.
      # This temporary step is removed as soon as the lockfile is committed.
      - name: Export lockfile for reproducible builds
        if: github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' 'BEGIN_PACKAGE_LOCK_B64'
          base64 -w 0 package-lock.json
          printf '\n%s\n' 'END_PACKAGE_LOCK_B64'
      - name: Check JavaScript syntax
        run: |
          find assets src tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Ruff / Pyflakes gate
        run: |
          ruff check .
          find . -type f -name '*.py' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './dist/*' \
            -not -path './offline/*' \
            -print0 | xargs -0 pyflakes
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config > /tmp/password-lab-local.yml
          docker compose -f docker-compose.qnap.yml config > /tmp/password-lab-qnap.yml
          grep -q '127.0.0.1' /tmp/password-lab-qnap.yml
          grep -q '18081' /tmp/password-lab-qnap.yml
      - name: Build local web bundle
        env:
          FEATURED_PROJECTS_REQUIRE_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: BUILD_SHA="${GITHUB_SHA::12}" BUILD_DATE="$(date -u +%FT%TZ)" BUILD_VERSION="ci" npm run build:web
      - name: Run all pytest tests
        run: pytest -q
      - name: Build offline edition
        env:
          FEATURED_PROJECTS_REQUIRE_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: BUILD_VERSION="ci" npm run build:offline
      - name: Build hardened Docker image
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA::12}" --build-arg BUILD_DATE="$(date -u +%FT%TZ)" --build-arg BUILD_VERSION="ci" -t password-lab:ci .
      - name: Start Docker image
        run: docker run -d --rm --name password-lab-ci -p 18080:8080 --read-only --tmpfs /tmp:size=16m --tmpfs /var/cache/nginx:size=16m --cap-drop ALL --security-opt no-new-privileges password-lab:ci
      - name: Verify health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"healthy":true'; then exit 0; fi
            sleep 1
          done
          docker logs password-lab-ci
          exit 1
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser smoke tests against Docker
        env:
          PASSWORD_LAB_BASE_URL: http://127.0.0.1:18080
        run: |
          python3 tests/browser_smoke.py
          python3 tests/about_smoke.py
      - name: Stop Docker image
        if: always()
        run: docker rm -f password-lab-ci || true
