# QNAP / Container Station production deployment
#
# Password Lab publishes only to QNAP loopback so a host-network Hotpot instance
# can reach it without exposing the application port directly to the LAN.
# Default upstream for Hotpot: http://127.0.0.1:18081

services:
  password-lab:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: password-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PASSWORD_LAB_HOST_PORT:-18081}:8080"
    environment:
      TZ: ${TZ:-America/Costa_Rica}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
