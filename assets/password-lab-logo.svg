<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Password Strength Lab logo</title>
  <desc id="desc">Three rising blue analysis bars beside an open white padlock on a dark navy rounded square.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="18%" cy="8%" r="95%">
      <stop offset="0" stop-color="#15549a"/>
      <stop offset="0.42" stop-color="#0b2b55"/>
      <stop offset="1" stop-color="#061326"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35e2f3"/>
      <stop offset="0.5" stop-color="#10baf1"/>
      <stop offset="1" stop-color="#1168ff"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#dce7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001028" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="484" height="484" rx="92" fill="url(#bgGlow)"/>
  <rect x="14.5" y="14.5" width="483" height="483" rx="91.5" fill="none" stroke="#1b5d9b" stroke-opacity="0.25"/>

  <g fill="url(#bar)" filter="url(#softShadow)">
    <rect x="62" y="312" width="58" height="112" rx="18"/>
    <rect x="139" y="267" width="58" height="157" rx="18"/>
    <rect x="216" y="218" width="58" height="206" rx="18"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M289 226v-39c0-66 43-110 106-110 65 0 108 45 108 111v47"
          fill="none" stroke="url(#lock)" stroke-width="42" stroke-linecap="round"/>
    <rect x="282" y="224" width="178" height="190" rx="34" fill="url(#lock)"/>
    <circle cx="371" cy="306" r="24" fill="#07172c"/>
    <path d="M357 324h28l13 52h-54z" fill="#07172c"/>
  </g>
</svg>
